<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديثات مكانك الجامعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2a0808, #450a0a, #7f1d1d);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glowing orbs - Red Theme */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
            z-index: 0;
        }
        .orb-1 {
            width: 500px;
            height: 500px;
            background: #ef4444; /* Bright Red */
            top: -100px;
            right: -100px;
        }
        .orb-2 {
            width: 600px;
            height: 600px;
            background: #b91c1c; /* Crimson */
            bottom: -150px;
            left: -100px;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: #f59e0b; /* Gold/Amber glow */
            bottom: 20%;
            right: 20%;
            opacity: 0.3;
        }

        .promo-container {
            position: relative;
            z-index: 10;
            width: 1080px;
            height: 1080px; /* Square size ideal for Instagram/Social Media */
            background: rgba(40, 10, 10, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 100, 100, 0.2);
            border-radius: 40px;
            padding: 70px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 0, 0, 0.1);
            overflow: hidden;
        }

        .promo-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, #ef4444, transparent);
            z-index: 20;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            z-index: 20;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .logo-text {
            font-size: 46px;
            font-weight: 900;
            background: linear-gradient(to right, #fecaca, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(239, 68, 68, 0.3);
        }

        .update-badge {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 26px;
            box-shadow: 0 10px 20px -5px rgba(220, 38, 38, 0.6);
            border: 1px solid #ef4444;
            color: #fff;
            letter-spacing: 1px;
        }

        .content-area {
            display: flex;
            flex: 1;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .text-column {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 35px;
            padding-left: 20px;
            z-index: 15;
        }

        .main-title {
            font-size: 68px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 10px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            color: #f8fafc;
        }

        .main-title span {
            color: #ef4444;
            background: linear-gradient(to right, #fca5a5, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
        }
        
        .main-title span::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #ef4444;
            border-radius: 2px;
        }

        .updates-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .update-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px 25px;
            border-radius: 24px;
            border-right: 6px solid #ef4444;
            font-size: 30px;
            font-weight: 700;
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
            border-left: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .update-item .icon {
            font-size: 38px;
            background: rgba(239, 68, 68, 0.2);
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .graphic-column {
            flex: 0.8;
            position: relative;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Luxurious 3D Shield/Mockup */
        .mockup-illustration {
            width: 360px;
            height: 600px;
            background: linear-gradient(135deg, rgba(239,68,68,0.1) 0%, rgba(127,29,29,0.4) 100%);
            border-radius: 45px;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: -30px 40px 60px rgba(0,0,0,0.6), inset 0 0 30px rgba(239,68,68,0.2);
            display: flex;
            flex-direction: column;
            padding: 24px;
            transform: perspective(1200px) rotateY(-18deg) rotateX(8deg) translateZ(50px);
            position: relative;
            backdrop-filter: blur(10px);
        }
        
        .mockup-illustration::before {
            content:'';
            position: absolute;
            top: 2%; bottom: 2%; left: 4%; right: 4%;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 35px;
            pointer-events: none;
        }

        .mockup-header {
            width: 100%;
            height: 25px;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .speaker-grill {
            width: 60px;
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
        }

        .mockup-body {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 20px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
        }

        .mockup-card {
            background: linear-gradient(90deg, rgba(239,68,68,0.3), rgba(239,68,68,0.05));
            border-radius: 15px;
            height: 80px;
            border-right: 4px solid #ef4444;
            position: relative;
            overflow: hidden;
        }
        .mockup-card::after {
            content: '';
            position: absolute;
            width: 30%; height: 100%;
            background: rgba(255,255,255,0.05);
            transform: skewX(-20deg);
            left: -10%;
        }

        .mockup-line {
            height: 16px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
        }
        .mockup-line.short { width: 40%; }
        .mockup-line.medium { width: 70%; }
        .mockup-line.full { width: 100%; }
        
        .mockup-graph {
            height: 180px;
            background: linear-gradient(to top, rgba(239, 68, 68, 0.25), transparent);
            border-radius: 15px;
            border-bottom: 3px solid #ef4444;
            position: relative;
            margin-top: auto;
        }

        footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 100, 100, 0.2);
            z-index: 20;
        }

        .contact-info {
            display: flex;
            gap: 40px;
            font-size: 26px;
            font-weight: 800;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #f1f5f9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .cta-button {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            padding: 16px 45px;
            border-radius: 40px;
            font-size: 30px;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 12px 25px -5px rgba(239, 68, 68, 0.6), inset 0 2px 5px rgba(255,255,255,0.3);
            border: 2px solid #fca5a5;
            transition: all 0.3s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="promo-container">
        <header>
            <div class="logo-area">
                <div class="logo-box">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <div class="logo-text">مكانك الجامعي</div>
            </div>
            <div class="update-badge">إنطلاقة جديدة 🚀</div>
        </header>

        <div class="content-area">
            <div class="text-column">
                <h1 class="main-title">أضخم تحديث لبنك<br><span>الأسئلة والاختبارات!</span></h1>
                
                <ul class="updates-list">
                    <li class="update-item">
                        <div class="icon">🎓</div>
                        <span>إضافة 7 مواد دراسية تفاعلية جديدة للمنصة.</span>
                    </li>
                    <li class="update-item">
                        <div class="icon">🧮</div>
                        <span>إدراج نماذج فاينل هندسية مع مخططات K-Maps!</span>
                    </li>
                    <li class="update-item">
                        <div class="icon">⚡</div>
                        <span>تطوير واجهة الأسئلة لتشمل دارات وجداول تفاعلية.</span>
                    </li>
                </ul>
            </div>

            <div class="graphic-column">
                <div class="mockup-illustration">
                    <div class="mockup-header">
                        <div class="speaker-grill"></div>
                    </div>
                    <div class="mockup-body">
                        <div class="mockup-line medium"></div>
                        <div class="mockup-line short"></div>
                        <div class="mockup-card"></div>
                        <div class="mockup-card" style="opacity: 0.7;"></div>
                        <div class="mockup-card" style="opacity: 0.4;"></div>
                        <div class="mockup-graph"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <div class="contact-info">
                <div class="contact-item">
                    <span>🌐</span> makanak-bau.com
                </div>
                <div class="contact-item">
                    <span>🎓</span> جامعة البلقاء التطبيقية
                </div>
            </div>
            <a href="#" class="cta-button">ابدأ التدريب الآن</a>
        </footer>
    </div>
</body>
</html>
